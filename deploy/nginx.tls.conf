user nginx;
worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  sendfile on;
  server_tokens off;
  keepalive_timeout 15;
  client_body_timeout 15s;
  client_header_timeout 10s;
  send_timeout 15s;
  client_max_body_size 6m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=per_ip:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  server { listen 80; server_name cup.example.com preview.example.net; return 301 https://$host$request_uri; }
  upstream backend { server api:3001; keepalive 8; }
  upstream preview_backend { server api:3002; keepalive 4; }
  server {
    listen 443 ssl;
    server_name cup.example.com;
    ssl_certificate /etc/nginx/certs/main/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/main/privkey.pem;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    limit_conn per_ip 20;
    location /api/ {
      limit_req zone=api_rate burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 20s;
    }
    location /media/ {
      proxy_pass http://backend;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 15s;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~* \.(png|webp|svg)$ { expires 1d; try_files $uri =404; }
    location / { add_header Cache-Control no-cache; try_files $uri $uri/ /index.html; }
  }
  server {
    listen 443 ssl;
    server_name preview.example.net;
    ssl_certificate /etc/nginx/certs/preview/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/preview/privkey.pem;
    limit_conn per_ip 8;
    location /preview/ {
      limit_req zone=api_rate burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://preview_backend;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_hide_header Set-Cookie;
      proxy_read_timeout 15s;
    }
    location / { return 404; }
  }
}

